<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #8a94a0;
    --accent: #2f7de1;
    --danger: #d64545;
    --border: #e1e5ea;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181c;
      --card: #1f2329;
      --text: #e6e9ed;
      --muted: #7d8794;
      --accent: #5b9cf0;
      --danger: #ef6b6b;
      --border: #2d333b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    max-width: 32rem;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
  }
  h1 { margin: 0 0 1rem; font-size: 1.5rem; }
  form { display: flex; gap: .5rem; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: .6rem .75rem;
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit;
    cursor: pointer;
    border: 0;
    border-radius: 8px;
  }
  .add {
    padding: .6rem 1rem;
    background: var(--accent);
    color: #fff;
  }
  ul { list-style: none; margin: 1rem 0 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .6rem 0;
    border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: 0; }
  li input[type="checkbox"] { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
  li label { flex: 1; overflow-wrap: anywhere; cursor: pointer; }
  li.done label { text-decoration: line-through; color: var(--muted); }
  .del {
    padding: .25rem .6rem;
    background: transparent;
    color: var(--danger);
    font-size: 1.25rem;
    line-height: 1;
  }
  .del:hover { background: var(--bg); }
  .section-title {
    margin: 1.5rem 0 0;
    padding-top: 1rem;
    border-top: 2px solid var(--border);
    font-size: .85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
  }
  #done-section ul { margin-top: .5rem; }
  .empty { color: var(--muted); text-align: center; margin: 1.5rem 0 0; }
  .count { color: var(--muted); font-size: .85rem; margin: 1rem 0 0; }
</style>
</head>
<body>
<main>
  <h1>To-Do List</h1>
  <form id="form">
    <input type="text" id="input" placeholder="What needs doing?" aria-label="New to-do" autocomplete="off" required>
    <button type="submit" class="add">Add</button>
  </form>
  <ul id="list"></ul>
  <section id="done-section" hidden>
    <h2 class="section-title">Completed</h2>
    <ul id="done-list"></ul>
  </section>
  <p class="empty" id="empty" hidden>Nothing to do. Add something above.</p>
  <p class="count" id="count"></p>
</main>

<script>
  const STORAGE_KEY = "todos";
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const list = document.getElementById("list");
  const doneList = document.getElementById("done-list");
  const doneSection = document.getElementById("done-section");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(data) ? data : [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {
      // Storage may be blocked or full; the app still works for this session.
    }
  }

  let todos = load();

  function makeRow(todo) {
      const li = document.createElement("li");
      if (todo.done) li.className = "done";

      const box = document.createElement("input");
      box.type = "checkbox";
      box.id = "todo-" + todo.id;
      box.checked = todo.done;
      box.addEventListener("change", () => {
        todo.done = box.checked;
        save();
        render();
      });

      const label = document.createElement("label");
      label.htmlFor = box.id;
      label.textContent = todo.text;

      const del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.textContent = "×";
      del.setAttribute("aria-label", "Delete: " + todo.text);
      del.addEventListener("click", () => {
        todos = todos.filter(t => t.id !== todo.id);
        save();
        render();
      });

      li.append(box, label, del);
      return li;
  }

  function render() {
    list.replaceChildren();
    doneList.replaceChildren();
    for (const todo of todos) {
      (todo.done ? doneList : list).append(makeRow(todo));
    }

    const remaining = todos.filter(t => !t.done).length;
    doneSection.hidden = remaining === todos.length;
    empty.hidden = todos.length > 0;
    count.textContent = todos.length
      ? remaining + " of " + todos.length + " remaining"
      : "";
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now() + Math.random().toString(36).slice(2, 6), text, done: false });
    input.value = "";
    save();
    render();
    input.focus();
  });

  render();
</script>
</body>
</html>
